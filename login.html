<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nutrimarg Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2e7d32;
            --accent: #8bc34a;
            --white-alpha: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1b3022 0%, #2e7d32 100%);
            overflow: hidden;
            position: relative;
        }

        /* --- Individualized Random Bouncing Logic --- */
        @keyframes random-float {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(calc(var(--x) * 1px), calc(var(--y) * 1px)) rotate(90deg); }
            50% { transform: translate(calc(var(--x2) * 1px), calc(var(--y2) * 1px)) rotate(180deg); }
            75% { transform: translate(calc(var(--x3) * 1px), calc(var(--y3) * 1px)) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        .food-icon {
            position: absolute;
            color: var(--white-alpha);
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.05));
            animation: random-float var(--duration) linear infinite;
        }

        /* Glassmorphism Card */
        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 3.5rem 2.5rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .logo-area i {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 15px rgba(139, 195, 74, 0.5));
        }

        h2 { color: white; margin-bottom: 0.5rem; font-size: 2rem; font-weight: 600; }
        p { color: rgba(255, 255, 255, 0.6); margin-bottom: 2.5rem; font-size: 0.9rem; }

        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { display: block; color: white; margin-bottom: 0.5rem; font-size: 0.85rem; }
        
        .input-field { position: relative; }
        .input-field i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.4); }

        input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.1); }

        .forgot-pass {
            display: block;
            text-align: right;
            margin-top: 0.8rem;
            font-size: 0.8rem;
            color: var(--accent);
            text-decoration: none;
        }

        .btn-signin {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #1b3022;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1.5rem;
        }

        .btn-signin:hover { background: white; transform: translateY(-3px); }
        .back-link { text-decoration: none; color: rgba(255, 255, 255, 0.5); font-size: 0.85rem; display: inline-block; margin-top: 2.5rem; }
    </style>
</head>
<body>

    <i class="fas fa-carrot food-icon" style="--duration: 25s; --x: 400; --y: -300; --x2: -200; --y2: 400; --x3: 600; --y3: 100; font-size: 3rem; top: 10%; left: 10%;"></i>
    <i class="fas fa-carrot food-icon" style="--duration: 35s; --x: -500; --y: 200; --x2: 300; --y2: -400; --x3: -100; --y3: 500; font-size: 5rem; top: 80%; left: 80%;"></i>
    
    <i class="fas fa-apple-alt food-icon" style="--duration: 22s; --x: 600; --y: 500; --x2: -300; --y2: -100; --x3: 200; --y3: -500; font-size: 4rem; top: 40%; left: 5%;"></i>
    <i class="fas fa-apple-alt food-icon" style="--duration: 40s; --x: -400; --y: -600; --x2: 500; --y2: 200; --x3: -600; --y3: -200; font-size: 2.5rem; top: 15%; left: 70%;"></i>

    <i class="fas fa-lemon food-icon" style="--duration: 18s; --x: 300; --y: -400; --x2: -500; --y2: 300; --x3: 400; --y3: -100; font-size: 3.5rem; top: 70%; left: 20%;"></i>
    <i class="fas fa-lemon food-icon" style="--duration: 30s; --x: -600; --y: 600; --x2: 200; --y2: -300; --x3: -400; --y3: 400; font-size: 4.5rem; top: 5%; left: 90%;"></i>

    <i class="fas fa-pepper-hot food-icon" style="--duration: 27s; --x: 500; --y: -100; --x2: -400; --y2: 500; --x3: 100; --y3: -600; font-size: 3rem; top: 50%; left: 50%;"></i>
    <i class="fas fa-leaf food-icon" style="--duration: 20s; --x: -200; --y: 500; --x2: 600; --y2: -200; --x3: -500; --y3: 100; font-size: 2rem; top: 25%; left: 30%;"></i>
    <i class="fas fa-seedling food-icon" style="--duration: 33s; --x: 400; --y: 400; --x2: -600; --y2: -600; --x3: 300; --y3: 300; font-size: 4rem; top: 85%; left: 40%;"></i>
    <i class="fas fa-grapes food-icon" style="--duration: 45s; --x: -300; --y: -300; --x2: 400; --y2: 400; --x3: -200; --y3: -200; font-size: 5rem; top: 60%; left: 75%;"></i>
    <i class="fas fa-bread-slice food-icon" style="--duration: 24s; --x: 200; --y: 200; --x2: -200; --y2: -200; --x3: 400; --y3: 400; font-size: 2.5rem; top: 5%; left: 45%;"></i>
    <i class="fas fa-fish food-icon" style="--duration: 29s; --x: -400; --y: 100; --x2: 300; --y2: -500; --x3: -300; --y3: 200; font-size: 3rem; top: 45%; left: 85%;"></i>

    <div class="login-card">
        <div class="logo-area">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2>Nutrimarg Access</h2>
        <p>Your journey to precision health starts here</p>

        <div class="input-group">
            <label>Email Address</label>
            <div class="input-field">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="client@nutrimarg.fit">
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-field">
                <i class="fas fa-key"></i>
                <input type="password" placeholder="••••••••">
            </div>
            <a href="javascript:void(0)" onclick="handleForgot()" class="forgot-pass">Forgot Password?</a>
        </div>

        <button class="btn-signin" onclick="handleLogin()">Sign In</button>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Nutrimarg.fit
        </a>
    </div>

    <script>
        function handleLogin() {
            alert("The secure portal is in Beta. Your account is being provisioned for our 2026 launch!");
        }
        function handleForgot() {
            alert("Password Recovery: Please contact nutrimarg.fit@gmail.com to reset your beta access credentials.");
        }
    </script>
</body>
</html>
